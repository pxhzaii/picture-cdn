# Cloudflare Pages 配置
# 部署时环境变量、R2 绑定请在 Pages Dashboard「Settings → Environment variables / Functions bindings」中配置
# 
# R2 绑定方式：Dashboard → Settings → Functions → R2 bucket bindings → Add binding
#   Variable name: MY_BUCKET
#   R2 bucket: 选择你的桶
#
# 环境变量（必填）：GH_TOKEN, GH_USER, GH_REPO, ACCESS_TOKEN
# 环境变量（可选）：GH_BRANCH, GH_EMAIL, TOKEN_REQUIRED, UPLOAD_R2, R2_PUBLIC_URL
